name: clerk
env_file:
  - .env
services:
  # FrankenPHP: Caddy with PHP embedded, one container for web + runtime
  # (D-027). It keeps the official PHP image layout, so it drops in as an
  # image override on Lando's php service and the composer/tooling wiring
  # survives. `via: cli` stops Lando expecting apache or nginx; `command`
  # replaces the `tail -f /dev/null` that `via: cli` would otherwise run.
  # The image's baked-in Caddyfile roots at SERVER_ROOT (default `public/`,
  # resolved against /app) and `php_server` applies the front-controller
  # fallback natively. SERVER_NAME ":80" turns off automatic HTTPS — Lando
  # terminates TLS itself.
  app:
    type: php:8.5
    via: cli
    image: dunglas/frankenphp:1-php8.5
    command: frankenphp run --config /etc/frankenphp/Caddyfile
    webroot: public
    composer_version: 2
    xdebug: false
    config:
      php: .lando/php/php.ini
    build_as_root:
      # FrankenPHP ships only PHP's default extensions (D-027); pdo_pgsql is
      # the Postgres driver, intl is required by cakephp/i18n (D-019), zip
      # keeps composer dist installs fast.
      - install-php-extensions pdo_pgsql intl zip
    overrides:
      environment:
        SERVER_NAME: ":80"
      # Publish on loopback explicitly. A bare "80" would leave the host
      # interface to Lando's global bindAddress default — loopback today, but
      # a machine-level setting this repo shouldn't silently depend on.
      ports:
        - 127.0.0.1::80
  database:
    type: postgres:16
    portforward: true
    # Lando's postgres service provisions the superuser as `postgres` with an
    # empty password and ignores a custom `creds` block. These are throwaway
    # container credentials for local development only — real credentials are
    # injected at runtime by Infisical (docs/decisions.md D-005).
    creds:
      database: clerk
tooling:
  php:
    service: app
    cmd: php
  composer:
    service: app
    cmd: composer
    description: "Run Composer commands"
  console:
    service: app
    cmd: php bin/console
    description: "Run the Clerk CLI"
  test:
    service: app
    cmd: vendor/bin/pest
    description: "Run the Pest test suite"
  stan:
    service: app
    cmd: vendor/bin/phpstan analyse
    description: "Run PHPStan static analysis"
  cs:
    service: app
    cmd: vendor/bin/phpcs
    description: "Check PSR-12 coding standards"
  phinx:
    service: app
    cmd: vendor/bin/phinx
    description: "Run Phinx migrations"
  psql:
    service: database
    cmd: psql -U postgres clerk
    description: "Open a psql shell on the staging database"
